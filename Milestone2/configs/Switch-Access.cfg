enable
configure terminal

! Global VLAN Creation
vlan 10
 name ADMIN
vlan 20
 name PROJECT
vlan 30
 name FINANCE
vlan 40
 name STAFF-WIFI
vlan 99
 name MANAGEMENT
exit

! Trunk Connection to Core-Switch-01
interface gigabitEthernet0/1
 description Trunk to Core-Switch-01 Gi0/2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
exit

! Project Workstations (VLAN 20: Ports Fa0/1 - Fa0/3)
interface range fastEthernet0/1 - 3
 description Project Department Host Ports
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

! Finance Workstations (VLAN 30: Ports Fa0/4 - Fa0/5)
interface range fastEthernet0/4 - 5
 description Finance Department Host Ports
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

! Staff Wi-Fi Access Point AP01 (VLAN 40: Port Fa0/6)
interface fastEthernet0/6
 description Staff Access Point AP01
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
exit

end
write memory
