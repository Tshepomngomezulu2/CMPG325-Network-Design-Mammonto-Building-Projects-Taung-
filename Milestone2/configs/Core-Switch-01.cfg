
enable
configure terminal

! Physical Interface Setup
interface gigabitEthernet0/0/0
 description Trunk Link to Core-Switch-01
 no shutdown
exit

! 802.1Q Subinterfaces & Gateways
interface gigabitEthernet0/0/0.10
 description Gateway for ADMIN VLAN
 encapsulation dot1Q 10
 ip address 10.32.10.1 255.255.255.0
 no shutdown
exit

interface gigabitEthernet0/0/0.20
 description Gateway for PROJECT VLAN
 encapsulation dot1Q 20
 ip address 10.32.20.1 255.255.255.0
 no shutdown
exit

interface gigabitEthernet0/0/0.30
 description Gateway for FINANCE VLAN
 encapsulation dot1Q 30
 ip address 10.32.30.1 255.255.255.0
 no shutdown
exit

interface gigabitEthernet0/0/0.40
 description Gateway for STAFF-WIFI VLAN
 encapsulation dot1Q 40
 ip address 10.32.40.1 255.255.255.0
 no shutdown
exit

interface gigabitEthernet0/0/0.99
 description Gateway for MANAGEMENT VLAN
 encapsulation dot1Q 99
 ip address 10.32.99.1 255.255.255.0
 no shutdown
exit

! DHCP Excluded Addresses
ip dhcp excluded-address 10.32.10.1 10.32.10.10
ip dhcp excluded-address 10.32.20.1 10.32.20.10
ip dhcp excluded-address 10.32.30.1 10.32.30.10
ip dhcp excluded-address 10.32.40.1 10.32.40.10

! DHCP Service Pools
ip dhcp pool ADMIN_POOL
 network 10.32.10.0 255.255.255.0
 default-router 10.32.10.1
exit

ip dhcp pool PROJECT_POOL
 network 10.32.20.0 255.255.255.0
 default-router 10.32.20.1
exit

ip dhcp pool FINANCE_POOL
 network 10.32.30.0 255.255.255.0
 default-router 10.32.30.1
exit

ip dhcp pool STAFF_WIFI_POOL
 network 10.32.40.0 255.255.255.0
 default-router 10.32.40.1
exit

end
write memory
