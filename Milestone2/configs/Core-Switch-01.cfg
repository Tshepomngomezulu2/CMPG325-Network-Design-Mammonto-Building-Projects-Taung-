enable
configure terminal

! Global VLAN Creation
vlan 10
 name ADMIN
vlan 20
 name PROJECT
vlan 30
 name FINANCE
vlan 40
 name STAFF-WIFI
vlan 99
 name MANAGEMENT
exit

! Trunk Connection to ISR4331 Router
interface gigabitEthernet0/1
 description Trunk to ISR4331 Router Gi0/0/0
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
exit

! Trunk Connection to Switch-Access
interface gigabitEthernet0/2
 description Trunk to Switch-Access Gi0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
exit

! Dedicated Management Server Interface (VLAN 99)
interface fastEthernet0/3
 description Management Server Interface
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 no shutdown
exit

end
write memory
